name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # 锁版：与维护环境实测版本一致，避免 latest 漂移导致口径不一致。
          version: "0.13.6"
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} ruff check .
      # 与 scripts/test.sh 同口径：--timeout=10。
      - run: uv run --python ${{ matrix.python-version }} pytest -q --timeout=10
      # 覆盖率门槛在 pyproject [tool.coverage.report] fail_under 中定义；
      # 仅主版本腿产出数字与工件，避免双份报告口径打架。
      - name: coverage
        if: matrix.python-version == '3.12'
        run: uv run --python ${{ matrix.python-version }} pytest -q --timeout=10 --cov=companion --cov-report=term --cov-report=xml
      - name: upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 与发布彩排同口径：固定 gitleaks 8.28.0 官方二进制直跑仓库
      # .gitleaks.toml。原先用的 gitleaks-action 捆绑版本与本地实测的
      # 8.28.0 在全局 allowlist 判定上存在差异，2026-11-02 公开仓
      # 首跑把 tests/ 内的合成假值（假 provider 凭证、日志脱敏测试
      # 标记）误报为 2 条 generic-api-key 泄漏；本地 8.28.0 同配置
      # dir/git 双扫均为 0。固定版本以消除该漂移。
      - name: Install gitleaks 8.28.0 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          ver=8.28.0
          asset="gitleaks_${ver}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
          curl -sSfL -o "/tmp/${asset}" "${base}/${asset}"
          curl -sSfL -o /tmp/gitleaks-checksums.txt "${base}/gitleaks_${ver}_checksums.txt"
          (cd /tmp && grep "${asset}" gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${asset}" -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Run gitleaks (repo config, same invocation as release rehearsal)
        run: /tmp/gitleaks git . --config .gitleaks.toml --no-banner

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 只验证镜像可构建；不在 CI 中启动整套服务（NapCat 登录需人工扫码，
      # 不属于自动化验证范围）。
      - run: docker build -t companion-bot:ci .
