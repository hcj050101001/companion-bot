services:
  companion:
    build: .
    env_file: .env
    environment:
      CONFIG_PATH: /app/config.yaml
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - napcat

  napcat:
    image: mlikiowa/napcat-docker:latest
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      MODE: reverse_http
      ONEBOT_URL: http://companion:8090/onebot/event
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:6099:6099"
    volumes:
      - napcat-data:/app/.config/QQ
      - napcat-config:/app/napcat/config
    restart: unless-stopped

volumes:
  napcat-data:
  napcat-config:
